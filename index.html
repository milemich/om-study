<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16302c">
<title>OM Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: colonna unica da telefono (max 560px), barra di navigazione in basso, percorso a nodi sinuoso */
:root{
  --bg:#eef1ee; --surface:#ffffff; --surface-2:#e3e9e5; --line:#d2dbd6;
  --ink:#16302c; --ink-2:#4d625d; --ink-3:#7f918c;
  --accent:#1f6f64; --accent-ink:#ffffff; --accent-soft:#d5ebe6;
  --gold:#b98317; --gold-soft:#f6ead0; --flame:#d4562a; --flame-soft:#fbe3d9;
  --ok:#2d8a4e; --ok-soft:#dcf1e3; --bad:#c2413a; --bad-soft:#f8dedc;
  --shadow:0 1px 2px rgba(22,48,44,.06),0 4px 14px rgba(22,48,44,.06);
  --f-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1715; --surface:#18221f; --surface-2:#212d2a; --line:#2c3a36;
  --ink:#e4ece8; --ink-2:#a9b9b4; --ink-3:#73857f;
  --accent:#4fb3a2; --accent-ink:#0b1513; --accent-soft:#1d3a35;
  --gold:#e0b04a; --gold-soft:#3a3020; --flame:#f07a4c; --flame-soft:#3d2219;
  --ok:#5cc47f; --ok-soft:#1a3324; --bad:#ef6b62; --bad-soft:#3d1f1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
.wrap.full{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.label{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-weight:800;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn[disabled]{background:var(--surface-2);color:var(--ink-3);box-shadow:none;cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none;border:2px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 3px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.btn.bad{background:var(--bad);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0}
.icon-btn{background:none;border:0;padding:8px;border-radius:10px;color:var(--ink-2);display:inline-flex}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.input{width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:1rem}
.input:focus{border-color:var(--accent);outline:none}
.msg{padding:12px 14px;border-radius:12px;font-size:.92rem}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.info{background:var(--accent-soft);color:var(--ink)}
svg.i{width:20px;height:20px;flex:none}

/* Login */
.auth{min-height:100%;display:grid;place-items:center}
.auth .card{width:100%;padding:28px 22px}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-bottom:8px}
.brand .mark{width:64px;height:64px}
.brand h1{font-size:2.1rem;letter-spacing:.02em}

/* Top stats */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem}
.chip.flame{color:var(--flame)} .chip.flame.off{color:var(--ink-3)}
.chip.gold{color:var(--gold)}
.chip.acc{color:var(--accent)}
.level{display:flex;align-items:center;gap:14px}
.level .badge-lv{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:1.4rem var(--f-display);flex:none}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .6s ease}
.bar.acc > i{background:var(--accent)}

/* Percorso */
.module-head{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink)}
.module-head h2{font-size:1.35rem}
.module-head p{margin:4px 0 0;opacity:.85;font-size:.9rem}
.module-head .tag{font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.2);margin-left:6px}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px 0 8px}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;width:180px}
.node{width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 55%,#000);position:relative}
.node svg{width:32px;height:32px}
.node.done{background:var(--gold);box-shadow:0 6px 0 color-mix(in srgb,var(--gold) 55%,#000);color:#fff}
.node.locked{background:var(--surface-2);color:var(--ink-3);box-shadow:0 6px 0 var(--line);cursor:not-allowed}
.node.current::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--accent);opacity:.5;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.15}}
.node-title{font-weight:700;font-size:.85rem;text-align:center;line-height:1.25}
.node-score{font-size:.75rem;color:var(--ink-3);font-weight:700}
.start-tip{background:var(--surface);color:var(--accent);font-weight:800;font-size:.75rem;letter-spacing:.06em;padding:5px 10px;border-radius:8px;box-shadow:var(--shadow);text-transform:uppercase}

/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.nav-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 7px;border-radius:12px;color:var(--ink-3);font-size:.72rem;font-weight:800;letter-spacing:.03em;position:relative}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent);background:var(--accent-soft)}
.nav .dot{position:absolute;top:2px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--flame);color:#fff;font-size:.68rem;display:grid;place-items:center}

/* Lezione */
.lesson-top{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;z-index:5}
.lesson-top .bar{flex:1}
.theory{font-size:1.02rem;line-height:1.7}
.theory p{margin:0 0 14px;white-space:pre-line}
.theory p:last-child{margin-bottom:0}
.q-prompt{font-family:var(--f-display);font-size:1.45rem;line-height:1.3}
.q-type{display:inline-flex;align-items:center;gap:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-weight:600;line-height:1.4;transition:border-color .1s,background .1s}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{text-align:center;font-size:1.1rem;font-weight:800;padding:22px 10px}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--accent);margin:0 4px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.match .opt{font-size:.88rem;padding:11px 12px;position:relative;min-height:52px}
.match .opt .n{position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center}
.feedback{position:fixed;left:0;right:0;bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:20;animation:up .2s ease-out}
.feedback.ok{background:var(--ok-soft)} .feedback.bad{background:var(--bad-soft)}
.feedback-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.feedback h3{font-family:var(--f-body);font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:8px}
.feedback.ok h3{color:var(--ok)} .feedback.bad h3{color:var(--bad)}
.feedback p{margin:0;font-size:.95rem}
@keyframes up{from{transform:translateY(100%)}}
.action-bar{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:6}
.action-bar > div{max-width:560px;margin:0 auto}

/* Risultato */
.result{text-align:center;align-items:center}
.result h1{font-size:2rem}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat{border-radius:12px;padding:12px 6px;border:2px solid var(--line);background:var(--surface)}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.stat.gold b{color:var(--gold)} .stat.acc b{color:var(--accent)} .stat.flame b{color:var(--flame)}
.new-badge{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--gold-soft);width:100%}
.new-badge .bi{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;flex:none}

/* Flashcard */
.fc{perspective:1200px;min-height:300px}
.fc-in{position:relative;width:100%;min-height:300px;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;box-shadow:var(--shadow)}
.fc-front{background:var(--surface)}
.fc-front h2{font-size:1.6rem}
.fc-back{background:var(--accent);color:var(--accent-ink);transform:rotateY(180deg);font-size:1.08rem;line-height:1.55}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:800;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.rate button small{font-weight:600;color:var(--ink-3);font-size:.72rem}
.rate .r1{color:var(--bad)} .rate .r3{color:var(--gold)} .rate .r4{color:var(--accent)} .rate .r5{color:var(--ok)}

/* Badge grid */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:12px 6px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.bdg .bi{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#fff}
.bdg .bi svg{width:24px;height:24px}
.bdg b{font-size:.82rem;line-height:1.2}
.bdg small{font-size:.7rem;color:var(--ink-3);line-height:1.3}
.bdg.off{box-shadow:none;background:transparent;border:2px dashed var(--line)}
.bdg.off .bi{background:var(--surface-2);color:var(--ink-3)}

/* Libri */
.link{display:inline-flex;align-items:center;gap:4px}
.cover{--cv:#2b4a78;width:84px;aspect-ratio:2/3;max-width:100%;flex:none;border-radius:4px 8px 8px 4px;padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-align:left;
  background:linear-gradient(90deg,rgba(0,0,0,.25) 0,rgba(0,0,0,0) 7px),linear-gradient(160deg,color-mix(in srgb,var(--cv) 80%,#fff) 0%,var(--cv) 55%,color-mix(in srgb,var(--cv) 70%,#000) 100%);
  box-shadow:0 2px 4px rgba(0,0,0,.18),0 8px 18px rgba(0,0,0,.14)}
.cover-t{font:1rem/1.15 var(--f-display);overflow-wrap:anywhere}
.cover-a{font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.cover.lg{width:104px}
.cover.lg .cover-t{font-size:1.15rem}
.book-card{display:flex;gap:16px;align-items:center;text-align:left;width:100%;border:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.book-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.book-title{font-family:var(--f-display);font-weight:400;font-size:1.25rem;line-height:1.2}
.book-head{display:flex;gap:16px;align-items:flex-start}
.chapters{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.chap{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.chap:last-child{border-bottom:0}
.chap-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:800;font-size:.85rem;flex:none;font-variant-numeric:tabular-nums}
.chap-t{flex:1;min-width:0;font-weight:600;line-height:1.3}
.chap-s{display:flex;gap:4px;flex:none}
.tick{color:var(--line);display:inline-flex} .tick.on{color:var(--accent)} .tick.gold{color:var(--gold)}
.tick svg{width:20px;height:20px}
.keys{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.keys li{position:relative;padding:10px 14px 10px 36px;background:var(--accent-soft);border-radius:10px;font-weight:600;line-height:1.4}
.keys li::before{content:"";position:absolute;left:15px;top:17px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.term{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--line)}
.term:last-child{border-bottom:0}
.stat b{color:var(--ink)}
.stat.gold b{color:var(--gold)} .stat.acc b{color:var(--accent)} .stat.flame b{color:var(--flame)}

/* Note */
.notes{display:flex;flex-direction:column}
.note{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.note-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.note-act{display:flex;gap:16px}
.note-act svg.i{width:16px;height:16px}
.notes-cap{padding-top:14px;color:var(--accent)}
textarea.input{resize:vertical;min-height:84px;line-height:1.5}
select.input{appearance:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--ink-2:#333;--line:#ccc;--shadow:none}
  .nav,.no-print,.note-act,.toast{display:none!important}
  .wrap{padding:0!important;max-width:none}
  .card{box-shadow:none;padding:0!important}
  .note{break-inside:avoid}
}

/* Segnalazioni */
.report-link,.report-done{display:inline-flex;align-items:center;gap:4px;color:var(--ink-3)}
.report-link svg,.report-done svg{width:14px;height:14px}
.sheet-wrap{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px)}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px 24px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto;animation:up .2s ease-out}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;line-height:1.4}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{margin-top:3px;accent-color:var(--accent)}

/* Admin */
.table-wrap{overflow-x:auto;border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:99px}
.pill.on{background:var(--ok-soft);color:var(--ok)} .pill.off{background:var(--surface-2);color:var(--ink-3)}
.pill.adm{background:var(--accent-soft);color:var(--accent)}
.switch{width:46px;height:28px;border-radius:99px;border:0;background:var(--surface-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch.on{background:var(--ok)} .switch.on::after{left:21px}
.spinner{width:34px;height:34px;border:4px solid var(--surface-2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* Music */
.song-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.song-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.song-ic svg{width:22px;height:22px}
.song-t{font-weight:800;line-height:1.3}
textarea.input{resize:vertical;min-height:180px;line-height:1.45}
.check{display:flex;gap:10px;align-items:center;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.hint{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:.84rem;line-height:1.5}
.hint code{background:var(--surface);padding:1px 6px;border-radius:6px;font-size:.92em}
/* Karaoke */
.kara{position:fixed;inset:0;z-index:20;background:#0f1715;color:#e4ece8;display:flex;flex-direction:column}
.kara-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 0}
.kara-top .link{color:#4fb3a2;display:inline-flex;align-items:center}
.kara-top .icon-btn{color:#a9b9b4}
.kara h1{font-size:1.5rem;text-align:center;padding:4px 16px 0;color:#e4ece8}
.kara-lines{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;text-align:center}
.kara-in{margin:auto 0;display:flex;flex-direction:column;gap:4px;padding:16px 0}
.kv{background:none;border:0;color:inherit;font:inherit;width:100%;padding:8px 0;cursor:pointer;font-family:var(--f-display);line-height:1.12;font-size:26px;opacity:.9;transition:font-size .25s,opacity .25s}
.kv[data-s=near]{font-size:22px;opacity:.55}
.kv[data-s=far]{font-size:21px;opacity:.32}
.kv[data-s=on]{font-size:32px;opacity:1}
.kv[data-s=on] .c{text-shadow:0 0 22px currentColor}
.kv .ly-s{font-family:var(--f-body);font-size:.5em;font-weight:800;letter-spacing:.03em}
.kn{display:block;font-family:var(--f-body);font-size:13px;font-weight:800;letter-spacing:.04em;max-height:0;opacity:0;overflow:hidden;transition:max-height .25s,opacity .25s}
.kv[data-s=on] .kn,.kv[data-s=idle] .kn{max-height:48px;opacity:1}
.kv[data-s=idle] .kn{opacity:.8}
.kara-bar{background:#18221f;border-top:1px solid #2c3a36;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}

.kara-seek{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.kara-seek input{width:100%;accent-color:#4fb3a2;margin:0}
.kara-seek div{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#a9b9b4;font-variant-numeric:tabular-nums}
.kara-msg{margin:0 16px 8px;text-align:center;font-size:.85rem;color:#a9b9b4}
.kprev{background:#0f1715;color:#e4ece8;border-radius:var(--r);padding:14px 10px;text-align:center}
.kprev .kv{cursor:default;font-size:24px;opacity:1;padding:5px 0}
.kprev .kn{max-height:48px;opacity:1}

<body>
<div id="beta-ribbon" class="beta-ribbon" hidden>VERSIONE BETA</div>
<div id="app"><div class="spinner" aria-label="Caricamento"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.441.0/dist/umd/lucide.min.js"></script>
<script>
"use strict";
const SUPABASE_URL = "https://auuatxzqvwjbwfketgjh.supabase.co";
const SUPABASE_KEY = "sb_publishable_CgSw4dG6JINDKUijsZ9czQ_3UrU1oAy";
const APP_URL = location.origin + location.pathname;
// Flag di build: true solo nella copia servita da /beta/. Non toccare qui — si aggiorna
// automaticamente quando si pubblica una nuova beta (vedi project-knowledge/STATO_PROGETTO.md).
const BETA_MODE = false;
const PROD_URL = location.origin + location.pathname.replace(/\/beta\/?$/, "/");

// Il tipo di link (invito / recupero password) va letto prima che il client ripulisca l'URL
const initialHash = new URLSearchParams(location.hash.replace(/^#/, ""));
const linkType = initialHash.get("type");
const linkError = initialHash.get("error_description");

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { flowType: "implicit", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
});

const S = { session: null, me: null, stats: null, tab: "path", mustSetPassword: false };
const $app = document.getElementById("app");

// ---------- utilità ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ico = (name, cls = "i") => `<i data-lucide="${name}" class="${cls}"></i>`;
const icons = () => { try { lucide.createIcons({ attrs: { "stroke-width": 2.2 } }); } catch (e) {} };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function render(html, full = false) {
  $app.innerHTML = `<div class="wrap ${full ? "full" : ""}">${html}</div>` + (full ? "" : navHTML());
  icons(); window.scrollTo(0, 0);
}
let toastT;
function toast(text) {
  const t = document.getElementById("toast"); t.textContent = text; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800);
}
function errText(e) {
  const m = (e && (e.message || e.error_description || e.error)) || String(e);
  if (/Invalid login credentials/i.test(m)) return "Email o password non corretti.";
  if (/Email not confirmed/i.test(m)) return "Devi prima accettare l'invito ricevuto via email.";
  if (/Password should be at least/i.test(m)) return "La password deve avere almeno 6 caratteri.";
  if (/same.*password|different from the old/i.test(m)) return "Scegli una password diversa da quella attuale.";
  if (/rate limit|too many/i.test(m)) return "Troppi tentativi ravvicinati. Riprova tra qualche minuto.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Connessione assente. Controlla la rete e riprova.";
  return m;
}
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }
async function q(promise) { const { data, error } = await promise; if (error) throw error; return data; }

const MARK = `<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="var(--accent)"/><path d="M32 12c-6 8-6 16 0 20 6-4 6-12 0-20Z" fill="var(--accent-ink)" opacity=".9"/><path d="M14 36c8-2 14 0 18 6-6 3-13 1-18-6Zm36 0c-8-2-14 0-18 6 6 3 13 1 18-6Z" fill="var(--accent-ink)" opacity=".75"/><circle cx="32" cy="48" r="3.5" fill="var(--gold)"/></svg>`;

// ---------- navigazione ----------
function navHTML() {
  const due = S.stats?.cards_due || 0;
  const items = [["path", "map", "Percorso"], ["books", "library", "Libri"], ["music", "music", "Music"], ["cards", "layers", "Ripasso"], ["profile", "user-round", "Profilo"]];
  if (S.me?.role === "admin") items.push(["admin", "settings-2", "Gestione"]);
  return `<nav class="nav"><div class="nav-in">${items.map(([k, ic, l]) =>
    `<button class="${S.tab === k ? "on" : ""}" data-tab="${k}">${ico(ic)}${l}${k === "cards" && due ? `<span class="dot">${due > 99 ? "99+" : due}</span>` : ""}</button>`).join("")}</div></nav>`;
}
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (b) { go(b.dataset.tab); }
});
function go(tab) {
  S.tab = tab;
  ({ path: viewPath, books: viewBooks, music: viewMusic, cards: () => viewCards(), profile: viewProfile, admin: viewAdmin })[tab]();
}

// ---------- autenticazione ----------
function viewLogin(notice) {
  $app.innerHTML = `<div class="wrap full auth"><div class="card stack">
    <div class="brand">${MARK}<h1>OM Study</h1><p class="muted small" style="margin:0">Studio di Biotransenergetica</p></div>
    ${notice ? `<div class="msg ${notice.type}">${esc(notice.text)}</div>` : ""}
    <form id="f" class="stack" novalidate>
      <div class="field"><label for="em">Email</label><input class="input" id="em" type="email" autocomplete="email" required></div>
      <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" autocomplete="current-password" required></div>
      <div id="err"></div>
      <button class="btn block" id="go">Entra</button>
    </form>
    <button class="link" id="forgot" type="button">Password dimenticata o primo accesso?</button>
    <p class="muted small" style="margin:0;text-align:center">L'accesso è riservato agli studenti invitati.</p>
  </div></div>`;
  const f = document.getElementById("f"), err = document.getElementById("err");
  f.addEventListener("submit", async e => {
    e.preventDefault(); err.innerHTML = "";
    const btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "Accesso…";
    const { error } = await sb.auth.signInWithPassword({ email: f.em.value.trim(), password: f.pw.value });
    if (error) { err.innerHTML = `<div class="msg err">${esc(errText(error))}</div>`; btn.disabled = false; btn.textContent = "Entra"; }
  });
  document.getElementById("forgot").onclick = viewForgot;
}
function viewForgot() {
  $app.innerHTML = `<div class="wrap full auth"><div class="card stack">
    <div class="brand">${MARK}<h1 style="font-size:1.6rem">Imposta la password</h1></div>
    <p class="muted" style="margin:0">Scrivi l'email con cui sei stato invitato. Ti mandiamo un link per scegliere una nuova password.</p>
    <form id="f" class="stack" novalidate>
      <div class="field"><label for="em">Email</label><input class="input" id="em" type="email" autocomplete="email" required></div>
      <div id="err"></div>
      <button class="btn block" id="go">Invia il link</button>
    </form>
    <button class="link" id="back" type="button">Torna all'accesso</button>
  </div></div>`;
  const f = document.getElementById("f");
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("go"); btn.disabled = true;
    const { error } = await sb.auth.resetPasswordForEmail(f.em.value.trim(), { redirectTo: APP_URL });
    if (error) { document.getElementById("err").innerHTML = `<div class="msg err">${esc(errText(error))}</div>`; btn.disabled = false; return; }
    viewLogin({ type: "info", text: "Se l'indirizzo è registrato, riceverai a breve un'email con il link. Controlla anche lo spam." });
  });
  document.getElementById("back").onclick = () => viewLogin();
}
function viewSetPassword() {
  const welcome = linkType === "invite";
  $app.innerHTML = `<div class="wrap full auth"><div class="card stack">
    <div class="brand">${MARK}<h1 style="font-size:1.6rem">${welcome ? "Benvenuto in OM Study" : "Nuova password"}</h1></div>
    <p class="muted" style="margin:0">${welcome ? "Scegli il nome con cui vuoi comparire e una password per i prossimi accessi." : "Scegli la nuova password."}</p>
    <form id="f" class="stack" novalidate>
      ${welcome ? `<div class="field"><label for="nm">Il tuo nome</label><input class="input" id="nm" autocomplete="name" value="${esc(S.me?.display_name || "")}"></div>` : ""}
      <div class="field"><label for="pw">Password (almeno 8 caratteri)</label><input class="input" id="pw" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label for="pw2">Ripeti la password</label><input class="input" id="pw2" type="password" autocomplete="new-password" required></div>
      <div id="err"></div>
      <button class="btn block" id="go">Salva e inizia</button>
    </form>
    ${S.mustSetPassword ? "" : `<button class="link" id="cancel" type="button">Annulla</button>`}
  </div></div>`;
  const cancel = document.getElementById("cancel"); if (cancel) cancel.onclick = viewProfile;
  const f = document.getElementById("f"), err = document.getElementById("err");
  f.addEventListener("submit", async e => {
    e.preventDefault(); err.innerHTML = "";
    const pw = f.pw.value;
    if (pw.length < 8) { err.innerHTML = `<div class="msg err">La password deve avere almeno 8 caratteri.</div>`; return; }
    if (pw !== f.pw2.value) { err.innerHTML = `<div class="msg err">Le due password non coincidono.</div>`; return; }
    const btn = document.getElementById("go"); btn.disabled = true;
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) { err.innerHTML = `<div class="msg err">${esc(errText(error))}</div>`; btn.disabled = false; return; }
    if (welcome && f.nm && f.nm.value.trim()) {
      await sb.from("profiles").update({ display_name: f.nm.value.trim() }).eq("id", S.session.user.id);
    }
    S.mustSetPassword = false;
    history.replaceState(null, "", APP_URL);
    toast("Password salvata");
    await boot();
  });
}

// ---------- dati comuni ----------
async function loadMe() {
  const uid = S.session.user.id;
  const [me, stats] = await Promise.all([
    q(sb.from("profiles").select("*").eq("id", uid).single()),
    rpc("get_my_stats")
  ]);
  S.me = me; S.stats = stats;
}
function statChips() {
  const s = S.stats || {};
  return `<div class="chips">
    <span class="chip flame ${s.active_today ? "" : "off"}" title="Giorni consecutivi">${ico("flame")}${s.current_streak || 0}</span>
    <span class="chip gold" title="Punti esperienza">${ico("star")}${s.xp || 0}</span>
    <span class="chip acc" title="Livello">${ico("sprout")}Liv. ${s.level || 1}</span>
  </div>`;
}

// ---------- PERCORSO ----------
async function viewPath() {
  S.tab = "path";
  render(`<div class="spinner"></div>`);
  try {
    await loadMe();
    const [modules, lessons, progress] = await Promise.all([
      q(sb.from("modules").select("*").eq("kind", "course").order("order_index")),
      q(sb.from("lessons").select("id,module_id,title,description,order_index,is_published").order("order_index")),
      q(sb.from("lesson_progress").select("*").eq("user_id", S.session.user.id))
    ]);
    const prog = Object.fromEntries(progress.map(p => [p.lesson_id, p]));
    const isAdmin = S.me.role === "admin";
    const s = S.stats;
    const span = Math.max(1, s.xp_next_level - s.xp_current_level);
    const pct = Math.min(100, Math.round((s.xp - s.xp_current_level) / span * 100));
    const offsets = [0, 52, 72, 52, 0, -52, -72, -52];

    let html = `<div class="topbar"><h1 style="font-size:1.5rem">Ciao, ${esc(S.me.display_name || "")}</h1></div>
      ${statChips()}
      <div class="card stack" style="gap:12px">
        <div class="level"><div class="badge-lv">${s.level}</div>
          <div style="flex:1;min-width:0"><div class="row" style="justify-content:space-between"><b>Livello ${s.level}</b><span class="small muted">${s.xp} / ${s.xp_next_level} XP</span></div>
          <div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div></div>
        ${s.cards_due ? `<button class="btn ghost block" data-tab="cards">${ico("layers")}${s.cards_due} flashcard da ripassare</button>` : ""}
        ${!s.active_today ? `<p class="small muted" style="margin:0">${s.current_streak ? `Studia oggi per non perdere la serie di ${s.current_streak} giorni.` : "Completa una lezione o ripassa qualche flashcard per iniziare la tua serie."}</p>` : `<p class="small muted" style="margin:0">Oggi hai guadagnato ${s.xp_today} XP. La serie continua.</p>`}
      </div>`;

    if (!modules.length) html += `<div class="card"><p class="muted" style="margin:0">Nessun modulo disponibile per ora.</p></div>`;

    for (const m of modules) {
      const ls = lessons.filter(l => l.module_id === m.id);
      const doneCount = ls.filter(l => prog[l.id]?.times_completed > 0).length;
      html += `<section><div class="module-head"><div style="flex:1;min-width:0">
          <div class="label" style="color:inherit;opacity:.75">Modulo ${m.order_index} · ${doneCount}/${ls.length} lezioni</div>
          <h2>${esc(m.title)}${!m.is_published ? `<span class="tag">BOZZA</span>` : ""}</h2>
          ${m.description ? `<p>${esc(m.description)}</p>` : ""}</div></div>
        <div class="path">`;
      let unlockedNext = true, currentSet = false;
      ls.forEach((l, i) => {
        const p = prog[l.id];
        const done = p?.times_completed > 0;
        const open = isAdmin || unlockedNext || done;
        const current = open && !done && !currentSet;
        if (current) currentSet = true;
        const cls = done ? "done" : open ? (current ? "current" : "") : "locked";
        const icon = done ? "check" : open ? "book-open" : "lock";
        html += `<div class="node-wrap" style="transform:translateX(${offsets[i % offsets.length]}px)">
          ${current ? `<span class="start-tip">${p ? "Riprova" : "Inizia"}</span>` : ""}
          <button class="node ${cls}" data-lesson="${l.id}" ${open ? "" : "disabled"} aria-label="${esc(l.title)}">${ico(icon)}</button>
          <span class="node-title">${esc(l.title)}</span>
          ${p ? `<span class="node-score">Migliore: ${Math.round(p.best_score)}%</span>` : ""}
        </div>`;
        unlockedNext = done;
      });
      html += `</div></section>`;
    }
    render(`<div class="stack">${html}</div>`);
    $app.querySelectorAll("[data-lesson]").forEach(b => b.onclick = () => startLesson(b.dataset.lesson, viewPath));
  } catch (e) { renderError(e); }
}
function renderError(e) {
  render(`<div class="card stack"><div class="msg err">${esc(errText(e))}</div><button class="btn" onclick="go(S.tab)">Riprova</button></div>`);
}

// ---------- LEZIONE ----------
const L = {};
async function startLesson(lessonId, back, skipTheory) {
  render(`<div class="spinner"></div>`, true);
  try {
    const [lesson, questions] = await Promise.all([
      q(sb.from("lessons").select("*").eq("id", lessonId).single()),
      q(sb.from("questions").select("id,type,prompt,options,difficulty,order_index").eq("lesson_id", lessonId).order("order_index"))
    ]);
    Object.assign(L, { lesson, questions, i: 0, attempt: null, correct: 0, back: back || viewPath, skipTheory });
    if (skipTheory) { L.attempt = await rpc("start_lesson", { p_lesson_id: lesson.id }); viewQuestion(); }
    else viewTheory();
  } catch (e) { renderError(e); }
}
function lessonTop(pct) {
  return `<div class="lesson-top"><button class="icon-btn" id="quit" aria-label="Esci dalla lezione">${ico("x")}</button>
    <div class="bar acc"><i style="width:${pct}%"></i></div></div>`;
}
function bindQuit() {
  document.getElementById("quit").onclick = () => {
    if (L.attempt && L.i > 0 && !document.getElementById("quit").dataset.armed) {
      document.getElementById("quit").dataset.armed = "1"; toast("Tocca di nuovo X per uscire: i progressi di questa lezione andranno persi"); return;
    }
    (L.back || viewPath)();
  };
}
function viewTheory() {
  const paras = (L.lesson.content || "").split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`).join("");
  $app.innerHTML = `<div class="wrap full" style="padding-top:0;padding-bottom:110px">${lessonTop(0)}
    <div class="stack">
      <div><div class="label">Scheda di teoria</div><h1 style="font-size:1.8rem;margin-top:4px">${esc(L.lesson.title)}</h1></div>
      <div class="card theory">${paras || `<p class="muted">Questa lezione non ha una scheda di teoria.</p>`}</div>
    </div></div>
    <div class="action-bar"><div><button class="btn block" id="go">${ico("play")}Inizia gli esercizi · ${L.questions.length} domande</button></div></div>`;
  icons(); window.scrollTo(0, 0); bindQuit();
  document.getElementById("go").onclick = async e => {
    e.currentTarget.disabled = true;
    try { L.attempt = await rpc("start_lesson", { p_lesson_id: L.lesson.id }); viewQuestion(); }
    catch (err) { toast(errText(err)); e.currentTarget.disabled = false; }
  };
}

const TYPE_LABEL = { multiple_choice: ["list-checks", "Scegli la risposta"], true_false: ["scale", "Vero o falso?"], fill_blank: ["pencil-line", "Completa la frase"], match: ["link-2", "Abbina le coppie"] };
const PAIR_COLORS = ["#1f6f64", "#b98317", "#d4562a", "#5b5fc7", "#a2427a", "#3b82a0"];

function viewQuestion() {
  const qq = L.questions[L.i];
  const pct = Math.round(L.i / L.questions.length * 100);
  const [tic, tl] = TYPE_LABEL[qq.type];
  let body = "", prompt = esc(qq.prompt);
  L.answer = undefined;

  if (qq.type === "multiple_choice") {
    body = `<div class="opts">${shuffle(qq.options).map(o => `<button class="opt" data-v="${esc(o.id)}">${esc(o.text)}</button>`).join("")}</div>`;
  } else if (qq.type === "true_false") {
    body = `<div class="tf"><button class="opt" data-v="true">Vero</button><button class="opt" data-v="false">Falso</button></div>`;
  } else if (qq.type === "fill_blank") {
    prompt = prompt.replace(/_{3,}/, `<span class="blank"></span>`);
    body = `<div class="field"><label for="fb">La tua risposta</label><input class="input" id="fb" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
  } else if (qq.type === "match") {
    L.left = qq.options.left; L.right = shuffle(qq.options.right); L.pairs = {}; L.pick = null;
    body = `<div class="match"><div class="col" id="ml"></div><div class="col" id="mr"></div></div>`;
  }

  $app.innerHTML = `<div class="wrap full" style="padding-top:0;padding-bottom:180px">${lessonTop(pct)}
    <div class="stack">
      <div class="row" style="justify-content:space-between"><div class="label q-type">${ico(tic)}${tl} · ${L.i + 1}/${L.questions.length}</div>${reportLink(qq.id)}</div>
      <h2 class="q-prompt">${prompt}</h2>
      ${body}
    </div></div>
    <div class="action-bar" id="ab"><div><button class="btn block" id="check" disabled>Verifica</button></div></div>`;
  icons(); window.scrollTo(0, 0); bindQuit();
  const check = document.getElementById("check");

  if (qq.type === "multiple_choice" || qq.type === "true_false") {
    $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      $app.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel");
      L.answer = qq.type === "true_false" ? b.dataset.v === "true" : b.dataset.v; check.disabled = false;
    });
  } else if (qq.type === "fill_blank") {
    const inp = document.getElementById("fb"); inp.focus();
    inp.oninput = () => { L.answer = inp.value; check.disabled = !inp.value.trim(); };
    inp.onkeydown = e => { if (e.key === "Enter" && !check.disabled) check.click(); };
  } else if (qq.type === "match") {
    drawMatch();
  }
  check.onclick = submitAnswer;
}
function drawMatch(result) {
  const colorOf = lid => PAIR_COLORS[L.left.findIndex(l => l.id === lid) % PAIR_COLORS.length];
  const rightOwner = Object.fromEntries(Object.entries(L.pairs).map(([l, r]) => [r, l]));
  document.getElementById("ml").innerHTML = L.left.map((l, idx) => {
    const paired = L.pairs[l.id]; let cls = "";
    if (result) cls = result.correct_answer[l.id] === paired ? "right" : "wrong";
    else if (L.pick === l.id) cls = "sel";
    const c = colorOf(l.id);
    return `<button class="opt ${cls}" data-l="${l.id}" ${result ? "disabled" : ""} style="${paired && !result ? `border-color:${c}` : ""}">${esc(l.text)}${paired ? `<span class="n" style="background:${c}">${idx + 1}</span>` : ""}</button>`;
  }).join("");
  document.getElementById("mr").innerHTML = L.right.map(r => {
    const owner = rightOwner[r.id]; const c = owner ? colorOf(owner) : "";
    const n = owner ? L.left.findIndex(l => l.id === owner) + 1 : 0;
    return `<button class="opt" data-r="${r.id}" ${result ? "disabled" : ""} style="${owner && !result ? `border-color:${c}` : ""}">${esc(r.text)}${owner ? `<span class="n" style="background:${c}">${n}</span>` : ""}</button>`;
  }).join("");
  if (result) return;
  $app.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
    const id = b.dataset.l;
    if (L.pairs[id]) { delete L.pairs[id]; L.pick = id; } else L.pick = L.pick === id ? null : id;
    afterMatch();
  });
  $app.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    const rid = b.dataset.r; const owner = rightOwner[rid];
    if (owner) { delete L.pairs[owner]; if (!L.pick) L.pick = owner; }
    if (L.pick) { L.pairs[L.pick] = rid; L.pick = L.left.find(l => !L.pairs[l.id])?.id || null; }
    afterMatch();
  });
}
function afterMatch() {
  drawMatch();
  const all = L.left.every(l => L.pairs[l.id]);
  L.answer = all ? { ...L.pairs } : undefined;
  document.getElementById("check").disabled = !all;
}
async function submitAnswer() {
  const qq = L.questions[L.i];
  const check = document.getElementById("check"); check.disabled = true; check.textContent = "Verifica…";
  let res;
  try { res = await rpc("submit_answer", { p_attempt_id: L.attempt, p_question_id: qq.id, p_answer: L.answer }); }
  catch (e) { toast(errText(e)); check.disabled = false; check.textContent = "Verifica"; return; }
  if (res.is_correct) L.correct++;

  // evidenzia
  if (qq.type === "multiple_choice" || qq.type === "true_false") {
    $app.querySelectorAll(".opt").forEach(b => {
      const v = qq.type === "true_false" ? b.dataset.v === "true" : b.dataset.v;
      b.disabled = true; b.classList.remove("sel");
      if (v === res.correct_answer) b.classList.add("right");
      else if (v === L.answer) b.classList.add("wrong");
    });
  } else if (qq.type === "fill_blank") {
    document.getElementById("fb").disabled = true;
  } else if (qq.type === "match") {
    drawMatch(res);
  }

  let solution = "";
  if (!res.is_correct) {
    if (qq.type === "multiple_choice") solution = qq.options.find(o => o.id === res.correct_answer)?.text;
    else if (qq.type === "true_false") solution = res.correct_answer ? "Vero" : "Falso";
    else if (qq.type === "fill_blank") solution = (res.correct_answer || [])[0];
    else if (qq.type === "match") solution = L.left.map(l => `${l.text} → ${qq.options.right.find(r => r.id === res.correct_answer[l.id])?.text}`).join("\n");
  }
  const last = L.i === L.questions.length - 1;
  const ok = res.is_correct;
  const praise = ["Esatto!", "Ottimo!", "Perfetto!", "Proprio così!"][Math.floor(Math.random() * 4)];
  document.getElementById("ab").outerHTML = `<div class="feedback ${ok ? "ok" : "bad"}"><div class="feedback-in">
    <h3>${ico(ok ? "circle-check" : "circle-x")}${ok ? praise : "Non proprio"}</h3>
    ${solution ? `<p style="white-space:pre-line"><b>Risposta corretta:</b> ${esc(solution)}</p>` : ""}
    ${res.explanation ? `<p>${esc(res.explanation)}</p>` : ""}
    <div class="row" style="justify-content:flex-end">${reportLink(qq.id)}</div>
    <button class="btn block ${ok ? "ok" : "bad"}" id="next">${last ? "Vedi il risultato" : "Continua"}</button>
  </div></div>`;
  icons();
  const next = document.getElementById("next"); next.focus();
  next.onclick = () => { if (last) finishLesson(); else { L.i++; viewQuestion(); } };
}

  render(`<div class="spinner"></div>`, true);

const REPORT_REASONS = {
  not_in_summary: "La risposta non si trova nella sintesi / scheda di teoria",
  wrong_answer: "La risposta indicata come corretta mi sembra sbagliata",
  unclear: "La domanda o le opzioni sono poco chiare",

const reported = new Set();
function reportLink(qid) {
  return reported.has(qid)
    ? `<span class="small muted report-done">${ico("flag")}Segnalata</span>`
    : `<button type="button" class="link small report-link" data-report="${qid}">${ico("flag")}Segnala</button>`;
}
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-report]"); if (b) openReport(b.dataset.report);
});
function openReport(qid) {
  const wrap = document.createElement("div");
  wrap.className = "sheet-wrap";
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rpt">
    <h2 id="rpt" style="font-size:1.3rem">Segnala un problema</h2>
    <p class="small muted" style="margin:0">La segnalazione arriva all'amministratore, che farà correggere la domanda.</p>
    <form class="stack" style="gap:10px" novalidate>
      <fieldset class="stack" style="gap:8px;border:0;padding:0;margin:0">
        <legend class="sr">Motivo</legend>
        ${Object.entries(REPORT_REASONS).map(([k, v], i) => `<label class="radio"><input type="radio" name="reason" value="${k}" ${i === 0 ? "checked" : ""}><span>${v}</span></label>`).join("")}
      </fieldset>
      <div class="field"><label for="rcm">Dettagli (facoltativo)</label>
        <textarea class="input" id="rcm" rows="3" maxlength="2000" placeholder="Es. nel libro la risposta è a pag. 54, oppure: secondo me è corretta anche la B"></textarea></div>
      <div class="row" style="flex-wrap:wrap"><button type="button" class="btn ghost" data-close style="flex:1 1 120px">Annulla</button><button class="btn" style="flex:1 1 120px">${ico("send")}Invia</button></div>
    </form></div>`;
  document.body.appendChild(wrap); icons();
  const close = () => wrap.remove();
  wrap.addEventListener("click", e => { if (e.target === wrap || e.target.closest("[data-close]")) close(); });
  document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); } });
  wrap.querySelector("input").focus();
  wrap.querySelector("form").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button:not([data-close])"); btn.disabled = true;
    try {
      await q(sb.from("question_reports").insert({ question_id: qid, reason: e.target.reason.value, comment: e.target.querySelector("textarea").value.trim() || null }));
      reported.add(qid);
      document.querySelectorAll(`[data-report="${qid}"]`).forEach(x => { x.outerHTML = reportLink(qid); }); icons();
      close(); toast("Grazie, segnalazione inviata");
    } catch (err) { toast(errText(err)); btn.disabled = false; }
  };
}

async function rate(quality, btn) {
  document.querySelectorAll("[data-q]").forEach(b => b.disabled = true);
  const c = F.queue[0];
  try {
    const r = await rpc("review_flashcard", { p_flashcard_id: c.id, p_quality: quality });

// ---------- NOTE ----------
const fmtDate = d => new Date(d).toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" });
function noteHTML(n, ctx) {
  return `<article class="note" data-note="${n.id}">
    <div class="note-meta">${ctx ? `<button class="link small" data-goch="${n.lesson_id || ""}">${esc(ctx)}</button>` : ""}
      ${n.page ? `<span class="pill off">p. ${esc(n.page)}</span>` : ""}<span class="small muted">${fmtDate(n.created_at)}</span></div>
    <div class="note-body">${esc(n.body)}</div>
    <div class="note-act"><button class="link small" data-nedit>${ico("pencil")}Modifica</button><button class="link small" data-ndel style="color:var(--bad)">${ico("trash-2")}Elimina</button></div>
  </article>`;
}
function bindNotes(container, onChange) {
  container.addEventListener("click", async e => {
    const art = e.target.closest("[data-note]"); if (!art) return;
    const id = art.dataset.note;
    const go = e.target.closest("[data-goch]");
    if (go && go.dataset.goch) return viewChapter(go.dataset.goch);
    if (e.target.closest("[data-ndel]")) {
      const b = e.target.closest("[data-ndel]");
      if (!b.dataset.armed) { b.dataset.armed = "1"; b.lastChild.textContent = "Conferma eliminazione"; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.lastChild.textContent = "Elimina"; } }, 4000); return; }
      try { await q(sb.from("notes").delete().eq("id", id)); art.remove(); toast("Nota eliminata"); onChange && onChange("del", id); }
      catch (err) { toast(errText(err)); }
      return;
    }
    if (e.target.closest("[data-nedit]")) {
      const body = art.querySelector(".note-body"); const page = art.querySelector(".pill")?.textContent.replace(/^p\.\s*/, "") || "";
      const old = body.textContent;
      art.querySelector(".note-act").hidden = true;
      body.outerHTML = `<form class="stack note-edit" style="gap:8px"><textarea class="input" rows="4">${esc(old)}</textarea>
        <div class="row" style="flex-wrap:wrap"><input class="input" style="flex:0 1 150px" placeholder="Pagina" value="${esc(page)}">
        <button class="btn" style="flex:1 1 100px">Salva</button><button type="button" class="btn ghost" data-ncancel style="flex:1 1 100px">Annulla</button></div></form>`;
      const f = art.querySelector(".note-edit"); f.querySelector("textarea").focus();
      f.querySelector("[data-ncancel]").onclick = () => onChange ? onChange("refresh") : viewChapterRefresh(art, old, page);
      f.onsubmit = async ev => {
        ev.preventDefault();
        const nb = f.querySelector("textarea").value.trim(); if (!nb) return;
        try {
          const n = await q(sb.from("notes").update({ body: nb, page: f.querySelector("input").value.trim() || null }).eq("id", id).select().single());
          const ctx = art.querySelector("[data-goch]")?.textContent;
          art.outerHTML = noteHTML(n, ctx); icons(); toast("Nota aggiornata"); onChange && onChange("upd", n);
        } catch (err) { toast(errText(err)); }
      };
    }
  });
}
function viewChapterRefresh(art, body, page) {
  art.outerHTML = noteHTML({ id: art.dataset.note, body, page, created_at: Date.now() }); icons();
}

async function viewNotes(bookId) {
  S.tab = "books";
  render(`<div class="spinner"></div>`);
  try {
    const [notes, books, lessons] = await Promise.all([
      q(sb.from("notes").select("*").order("created_at")),
      q(sb.from("modules").select("id,title,author,order_index").eq("kind", "book").order("order_index")),
      q(sb.from("lessons").select("id,module_id,title,order_index"))
    ]);
    const L = Object.fromEntries(lessons.map(l => [l.id, l]));
    const B = Object.fromEntries(books.map(b => [b.id, b]));
    const st = { book: bookId || "", q: "" };
    const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const filtered = () => notes.filter(n => (!st.book || n.module_id === st.book) &&
      (!st.q || norm(n.body + " " + (n.page || "")).includes(norm(st.q))))
      .sort((a, b) => (B[a.module_id]?.order_index ?? 0) - (B[b.module_id]?.order_index ?? 0)
        || (L[a.lesson_id]?.order_index ?? 999) - (L[b.lesson_id]?.order_index ?? 999)
        || new Date(a.created_at) - new Date(b.created_at));
    const capLabel = n => L[n.lesson_id] ? `Cap. ${L[n.lesson_id].order_index} · ${L[n.lesson_id].title}` : "Note generali";

    render(`<div class="stack">
      <button class="link no-print" id="back" style="align-self:flex-start">${ico("chevron-left")}${bookId && B[bookId] ? esc(B[bookId].title) : "Libri"}</button>
      <h1 style="font-size:1.6rem">Le mie note</h1>
      <p class="small muted no-print" style="margin:0">Le note sono private: le vedi solo tu. Puoi aggiungerle dalla pagina di ogni capitolo.</p>
      <div class="row no-print" style="flex-wrap:wrap">
        <select class="input" id="nbook" style="flex:1 1 200px" aria-label="Filtra per libro">
          <option value="">Tutti i libri</option>${books.map(b => `<option value="${b.id}" ${b.id === st.book ? "selected" : ""}>${esc(b.title)}</option>`).join("")}
        </select>
        <input class="input" id="nq" type="search" style="flex:1 1 200px" placeholder="Cerca nelle note" aria-label="Cerca nelle note" autocomplete="off">
      </div>
      <div class="card stack no-print" style="gap:10px;padding:14px 16px">
        <div class="label">Esporta <span id="ncount"></span></div>
        <div class="row" style="flex-wrap:wrap;gap:8px">
          <button class="btn ghost" id="exdoc" style="flex:1 1 130px">${ico("file-text")}Word</button>
          <button class="btn ghost" id="extxt" style="flex:1 1 130px">${ico("file")}Testo</button>
          <button class="btn ghost" id="excopy" style="flex:1 1 130px">${ico("copy")}Copia</button>
          <button class="btn ghost" id="exprint" style="flex:1 1 130px">${ico("printer")}Stampa / PDF</button>
        </div>
      </div>
      <div id="nall" class="stack"></div>
    </div>`);

    const draw = () => {
      const list = filtered();
      document.getElementById("ncount").textContent = `· ${list.length} ${list.length === 1 ? "nota" : "note"}`;
      if (!list.length) {
        document.getElementById("nall").innerHTML = `<div class="card"><p class="muted" style="margin:0">${notes.length ? "Nessuna nota corrisponde alla ricerca." : "Non hai ancora scritto note. Apri un capitolo di un libro e usa il riquadro «Le mie note»."}</p></div>`;
        return;
      }
      let html = "", curB = null, curL = undefined;
      for (const n of list) {
        if (n.module_id !== curB) {
          if (curB !== null) html += `</div></section>`;
          curB = n.module_id; curL = undefined;
          html += `<section class="stack" style="gap:10px"><h2 style="font-size:1.25rem">${esc(B[curB]?.title || "Libro")}<span class="small muted" style="font-family:var(--f-body)"> · ${esc(B[curB]?.author || "")}</span></h2><div class="card notes" style="padding:4px 16px">`;
        }
        if (n.lesson_id !== curL) { curL = n.lesson_id; html += `<div class="label notes-cap">${esc(capLabel(n))}</div>`; }
        html += noteHTML(n, null);
      }
      html += `</div></section>`;
      document.getElementById("nall").innerHTML = html; icons();
    };
    draw();
    bindNotes(document.getElementById("nall"), (kind, x) => {
      if (kind === "del") { const i = notes.findIndex(n => n.id === x); if (i > -1) notes.splice(i, 1); draw(); }
      else if (kind === "upd") { const i = notes.findIndex(n => n.id === x.id); if (i > -1) notes[i] = x; }
      else draw();
    });
    document.getElementById("nbook").onchange = e => { st.book = e.target.value; draw(); };
    document.getElementById("nq").oninput = e => { st.q = e.target.value; draw(); };
    document.getElementById("back").onclick = () => bookId ? viewBook(bookId) : viewBooks();

    const build = () => {
      const list = filtered(); const groups = [];
      for (const n of list) {
        let g = groups.find(g => g.book === n.module_id); if (!g) groups.push(g = { book: n.module_id, caps: [] });
        let c = g.caps.find(c => c.id === (n.lesson_id || null)); if (!c) g.caps.push(c = { id: n.lesson_id || null, label: capLabel(n), notes: [] });
        c.notes.push(n);
      }
      return groups;
    };
    const today = new Date().toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" });
    const who = S.me?.display_name || "";
    const asText = () => {
      let t = `LE MIE NOTE · OM Study\n${who}${who ? " · " : ""}${today}\n`;
      for (const g of build()) {
        t += `\n\n${(B[g.book]?.title || "").toUpperCase()}${B[g.book]?.author ? " · " + B[g.book].author : ""}\n${"=".repeat(40)}\n`;
        for (const c of g.caps) {
          t += `\n${c.label}\n${"-".repeat(Math.min(c.label.length, 40))}\n`;
          for (const n of c.notes) t += `${n.page ? "[p. " + n.page + "] " : ""}${n.body}\n\n`;
        }
      }
      return t;
    };
    const asHTML = () => {
      let h = `<h1>Le mie note</h1><p style="color:#666">${esc(who)}${who ? " · " : ""}${esc(today)} · OM Study</p>`;
      for (const g of build()) {
        h += `<h2>${esc(B[g.book]?.title || "")}</h2><p style="color:#666">${esc(B[g.book]?.author || "")}</p>`;
        for (const c of g.caps) {
          h += `<h3>${esc(c.label)}</h3>`;
          for (const n of c.notes) h += `<p>${n.page ? `<b>p. ${esc(n.page)}</b> — ` : ""}${esc(n.body).replace(/\n/g, "<br>")}</p>`;
        }
      }
      return h;
    };
    const fname = () => "note-" + (st.book && B[st.book] ? B[st.book].title.toLowerCase().replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "") : "om-study");
    const download = (content, type, ext) => {
      if (!filtered().length) return toast("Non ci sono note da esportare");
      const url = URL.createObjectURL(new Blob([content], { type }));
      const a = document.createElement("a"); a.href = url; a.download = fname() + ext;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast("File scaricato");
    };
    document.getElementById("extxt").onclick = () => download("﻿" + asText(), "text/plain;charset=utf-8", ".txt");
    document.getElementById("exdoc").onclick = () => download(
      `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Le mie note</title>
      <style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt;line-height:1.5}h1{font-size:20pt}h2{font-size:15pt;margin-top:18pt;color:#1f6f64}h3{font-size:12pt;margin-top:12pt}</style></head><body>${asHTML()}</body></html>`,
      "application/msword", ".doc");
    document.getElementById("excopy").onclick = async () => {
      if (!filtered().length) return toast("Non ci sono note da copiare");
      try { await navigator.clipboard.writeText(asText()); toast("Note copiate negli appunti"); }
      catch (e) { toast("Copia non riuscita: usa l'esportazione in Testo"); }
    };
    document.getElementById("exprint").onclick = () => { if (!filtered().length) return toast("Non ci sono note da stampare"); window.print(); };
  } catch (e) { renderError(e); }
}

async function viewGlossary(book) {
  render(`<div class="spinner"></div>`);
  try {
    const [terms, ls] = await Promise.all([
      q(sb.from("glossary_terms").select("term,definition,lesson_id").eq("module_id", book.id)),
      q(sb.from("lessons").select("id,order_index").eq("module_id", book.id))
    ]);
    const capOf = Object.fromEntries(ls.map(l => [l.id, l.order_index]));
    const norm = s => s.normalize("NFD").replace(/[̀-ͯ«»"/]/g, "").trim().toLowerCase();
    terms.sort((a, b) => norm(a.term).localeCompare(norm(b.term), "it"));
    render(`<div class="stack">
      <button class="link" id="back" style="align-self:flex-start">${ico("chevron-left")}${esc(book.title)}</button>
      <h1 style="font-size:1.6rem">Glossario</h1>
      <div class="field"><label for="gq" class="small muted">Cerca un termine</label><input class="input" id="gq" type="search" autocomplete="off" placeholder="Es. Thauma, soglia, ironia"></div>
      <div class="card" style="padding:4px 16px" id="gl"></div>
    </div>`);
    const draw = f => {
      const list = terms.filter(t => !f || norm(t.term + " " + t.definition).includes(norm(f)));
      document.getElementById("gl").innerHTML = list.length ? list.map(t => `<div class="term">
        <div class="row" style="justify-content:space-between;align-items:baseline"><b>${esc(t.term)}</b>${t.lesson_id ? `<button class="link small" data-ch="${t.lesson_id}">cap. ${capOf[t.lesson_id]}</button>` : ""}</div>
        <span class="small muted">${esc(t.definition)}</span></div>`).join("") : `<p class="muted">Nessun termine trovato.</p>`;
      document.querySelectorAll("#gl [data-ch]").forEach(b => b.onclick = () => viewChapter(b.dataset.ch));
    };
    draw("");
    document.getElementById("gq").oninput = e => draw(e.target.value);
    document.getElementById("back").onclick = () => viewBook(book.id);
  } catch (e) { renderError(e); }
}

// ---------- MUSIC ----------
const KCOL = { rosso: "#ff5d5d", arancio: "#ff8a3d", oro: "#f0b429", giallo: "#f5e050", verde: "#4fcf7a", azzurro: "#4cc3ff", blu: "#7f93ff", viola: "#c58bff", rosa: "#ff7ab8", marrone: "#d39a5e", grigio: "#bdbdbd", nero: "#e4ece8" };
const RAINBOW = ["#ff5d5d", "#ff8a3d", "#f5e050", "#4fcf7a", "#7f93ff", "#c58bff"];
// Sintassi testi: una riga = un verso. [colore] cambia colore da lì in poi; (testo) = nota piccola;
// una riga che inizia con "(" è la nota del verso sopra; @1:35.2 (o @0:12,1:05 per più ripetizioni) = tempo/i in cui il verso inizia.
const parseT = x => { x = x.trim(); const m = x.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/); return m ? (+(m[1] || 0)) * 60 + parseFloat(m[2]) : NaN; };
const fmtT = t => { const m = Math.floor(t / 60), sec = t - m * 60; return `${m}:${sec < 10 ? "0" : ""}${sec.toFixed(1)}`; };
const fmtClock = t => { t = Math.max(0, Math.floor(t || 0)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
const LY_TIME = /^@([0-9:.,\s]+?)(?:\s+|$)/;
const stripLine = l => l.trim().replace(LY_TIME, "").replace(/\[[^\]]+\]/g, "").trim();
const isNoteLine = l => stripLine(l).startsWith("(");
function parseLyrics(text) {
  let cur = "#e4ece8", ri = 0;
  const verses = [];
  const paint = t => {
    if (cur === "rainbow") return [...t].map(ch => /\s/.test(ch) ? ch : `<span class="c" style="color:${RAINBOW[ri++ % RAINBOW.length]}">${esc(ch)}</span>`).join("");
    return `<span class="c" style="color:${cur}">${esc(t)}</span>`;
  };
  for (const raw of String(text || "").split("\n")) {
    let line = raw.trim(); if (!line) continue;
    let times = [];
    const tm = line.match(LY_TIME);
    if (tm) { times = tm[1].split(",").map(parseT).filter(Number.isFinite); line = line.slice(tm[0].length); }
    ri = 0; let html = "";
    for (const part of line.split(/(\[[^\]]+\])/)) {
      if (!part) continue;
      const m = part.match(/^\[([^\]]+)\]$/);
      if (m) { const k = m[1].trim().toLowerCase(); cur = k === "arcobaleno" ? "rainbow" : /^#[0-9a-f]{3,8}$/.test(k) ? k : (KCOL[k] || cur); continue; }
      html += part.split(/(\([^)]*\))/).filter(Boolean).map(t => /^\(.*\)$/.test(t) ? `<span class="ly-s">${paint(t)}</span>` : paint(t)).join("");
    }
    if (!html) continue;
    if (stripLine(raw).startsWith("(") && verses.length) { verses[verses.length - 1].note += (verses[verses.length - 1].note ? " " : "") + html; continue; }
    verses.push({ times, html, note: "" });
  }
  return verses;
}
const versesHTML = vs => vs.map((v, i) => `<button class="kv" data-i="${i}" data-s="idle">${v.html}${v.note ? `<span class="kn">${v.note}</span>` : ""}</button>`).join("");

let kAudio = null, kRaf = 0;
function stopAudio() { cancelAnimationFrame(kRaf); if (kAudio) { try { kAudio.pause(); } catch (e) {} kAudio = null; } }

async function viewMusic() {
  stopAudio();
  S.tab = "music";
  render(`<div class="spinner"></div>`);
  try {
    await loadMe();
    const admin = S.me?.role === "admin";

    render(`<div class="stack"><div class="topbar"><h1 style="font-size:1.5rem">Music</h1></div>${statChips()}
      <p class="muted" style="margin:0">I canti del corso: ascolta la registrazione e segui il testo.</p>
      ${admin ? `<button class="btn ghost" id="newsong">${ico("plus")}Nuova canzone</button>` : ""}
      ${songs.map(x => `<button class="song-row" data-song="${x.id}"><span class="song-ic">${ico("music")}</span>
        <span style="min-width:0;flex:1"><span class="song-t">${esc(x.title)}</span>${admin && (!x.audio_path || !x.is_published) ? `<div class="small muted">${[!x.audio_path ? "audio mancante" : "", !x.is_published ? "bozza" : ""].filter(Boolean).join(" · ")}</div>` : ""}</span>
        ${ico("chevron-right")}</button>`).join("") || `<div class="card"><p class="muted" style="margin:0">Nessuna canzone disponibile per ora.</p></div>`}
    </div>`);
    $app.querySelectorAll("[data-song]").forEach(b => b.onclick = () => viewSong(b.dataset.song));
    if (admin) document.getElementById("newsong").onclick = () => editSong(null);

async function viewSong(id) {
  stopAudio();
  S.tab = "music";
  render(`<div class="spinner"></div>`);
  try {
    const song = await q(sb.from("songs").select("*").eq("id", id).single());
    let url = null;
    if (song.audio_path) { const { data } = await sb.storage.from("music").createSignedUrl(song.audio_path, 3600); url = data?.signedUrl || null; }
    const admin = S.me?.role === "admin";
    const verses = parseLyrics(song.lyrics);
    const timeline = verses.flatMap((v, i) => v.times.map(t => ({ t, i }))).sort((a, b) => a.t - b.t);
    const PLAY = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>`;
    const PAUSE = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`;
    render(`<div class="kara">
      <div class="kara-top"><button class="link" id="back">${ico("chevron-left")}Music</button>
        ${admin ? `<button class="icon-btn" id="edit" aria-label="Modifica">${ico("pencil")}</button>` : ""}</div>
      <h1>${esc(song.title)}</h1>
      <div class="kara-lines"><div class="kara-in">${verses.length ? versesHTML(verses) : `<p class="kara-msg">Il testo non è ancora stato aggiunto.</p>`}</div></div>
      ${url ? `<div class="kara-bar"><audio id="au" preload="metadata" src="${esc(url)}"></audio>
        <button class="play" id="pp" aria-label="Riproduci">${PLAY}</button>
        <div class="kara-seek"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posizione"><div><span id="tc">0:00</span><span id="td">0:00</span></div></div>
        <button class="loop" id="loop" aria-label="Ripeti in loop" aria-pressed="false">${ico("repeat")}</button></div>`
        : `<p class="kara-msg" style="padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))">${song.audio_path ? "Non riesco a caricare la registrazione. Riprova tra poco." : "La registrazione non è ancora stata caricata."}</p>`}
    </div>`, true);
    document.getElementById("back").onclick = () => { stopAudio(); viewMusic(); };
    if (admin) document.getElementById("edit").onclick = () => { stopAudio(); editSong(song); };
    const els = [...document.querySelectorAll(".kv")];
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let active = -1;
    const setActive = i => {
      if (i === active) return; active = i;
      els.forEach((el, j) => { el.dataset.s = i < 0 ? "idle" : j === i ? "on" : Math.abs(j - i) === 1 ? "near" : "far"; });
      if (i >= 0) els[i].scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
    };
    const au = document.getElementById("au");
    if (!au) { els.forEach((el, i) => el.onclick = () => setActive(i)); return; }
    kAudio = au;
    const pp = document.getElementById("pp"), seek = document.getElementById("seek"), tc = document.getElementById("tc"), td = document.getElementById("td");
    const sync = () => {
      const d = au.duration || 0;
      if (!seek.dataset.drag) seek.value = d ? Math.round(au.currentTime / d * 1000) : 0;
      tc.textContent = fmtClock(au.currentTime); td.textContent = fmtClock(d);
    };
    const tick = () => {
      if (timeline.length) { let idx = -1; for (const e of timeline) { if (e.t <= au.currentTime + 0.05) idx = e.i; else break; } setActive(idx); }
      sync();
      if (!au.paused) kRaf = requestAnimationFrame(tick);
    };
    au.addEventListener("play", () => { pp.innerHTML = PAUSE; pp.setAttribute("aria-label", "Pausa"); cancelAnimationFrame(kRaf); kRaf = requestAnimationFrame(tick); });
    au.addEventListener("pause", () => { pp.innerHTML = PLAY; pp.setAttribute("aria-label", "Riproduci"); });
    ["loadedmetadata", "durationchange", "seeked", "timeupdate"].forEach(ev => au.addEventListener(ev, () => { if (au.paused) tick(); }));
    pp.onclick = () => { au.paused ? au.play().catch(() => toast("Impossibile avviare l'audio")) : au.pause(); };
    seek.oninput = () => { seek.dataset.drag = "1"; if (au.duration) au.currentTime = seek.value / 1000 * au.duration; };
    seek.onchange = () => { delete seek.dataset.drag; };
    const loop = document.getElementById("loop");
    loop.onclick = () => { au.loop = !au.loop; loop.classList.toggle("on", au.loop); loop.setAttribute("aria-pressed", au.loop); };
    els.forEach((el, i) => el.onclick = () => {
      const t = verses[i].times[0];
      if (t !== undefined) { au.currentTime = t; au.play().catch(() => {}); } else setActive(i);
    });
  } catch (e) { renderError(e); }
}
async function editSong(song) {
  const isNew = !song;
  let audioSrc = null;
  if (song?.audio_path) { try { const { data } = await sb.storage.from("music").createSignedUrl(song.audio_path, 3600); audioSrc = data?.signedUrl || null; } catch (e) {} }
  render(`<div class="stack">
    <button class="link" id="back" style="align-self:flex-start">${ico("chevron-left")}Indietro</button>
    <h1 style="font-size:1.5rem">${isNew ? "Nuova canzone" : "Modifica canzone"}</h1>
    <form id="sf" class="stack" novalidate>
      <div class="field"><label for="st">Titolo</label><input class="input" id="st" value="${esc(song?.title || "")}" required></div>
      <div class="field"><label for="sa">Registrazione audio</label>
        <input class="input" id="sa" type="file" accept="audio/*,.m4a,.mp3,.wav,.ogg">
        ${song?.audio_path ? `<span class="small muted">Già caricata. Scegli un file solo per sostituirla.</span>` : ""}</div>
      <div class="field"><label for="sl">Testo</label><textarea class="input" id="sl" rows="10" spellcheck="false">${esc(song?.lyrics || "")}</textarea></div>
      <div class="hint">Ogni riga è un verso. Colore: <code>[rosso]</code> prima del testo, vale fino al cambio (anche sulle righe dopo).
        Colori: rosso, arancio, oro, giallo, verde, azzurro, blu, viola, rosa, marrone, grigio, nero, arcobaleno, oppure <code>[#1a2b3c]</code>.
        Il testo tra <code>(parentesi)</code> diventa più piccolo; una riga che inizia con <code>(</code> è la nota del verso sopra.
        I tempi (<code>@1:35.2</code>) li inserisce lo strumento qui sotto.</div>
      <div class="card stack" id="syncbox" ${audioSrc ? "" : "hidden"}>
        <div class="label">Tempi del karaoke</div>
        <audio id="sau" controls preload="metadata" style="width:100%" ${audioSrc ? `src="${esc(audioSrc)}"` : ""}></audio>
        <button type="button" class="btn" id="tap">${ico("timer")}<span id="taplbl"></span></button>
        <div class="row" style="justify-content:space-between"><button type="button" class="link" id="undo">Annulla l'ultimo</button><button type="button" class="link" id="clr" style="color:var(--bad)">Azzera tutti i tempi</button></div>
        <p class="small muted" style="margin:0">Fai partire la registrazione e tocca il pulsante nel momento in cui inizia ogni verso. Dopo l'ultimo si riparte dal primo (per le ripetizioni). Poi salva.</p>
      </div>
      <div class="label">Anteprima</div>
      <div class="kprev" id="prev"></div>
      <label class="check"><input type="checkbox" id="sp" ${song?.is_published === false ? "" : "checked"}>Visibile agli studenti</label>
      <div id="serr"></div>
      <button class="btn" id="sbtn">${ico("save")}Salva</button>
      ${isNew ? "" : `<button type="button" class="btn ghost" id="sdel" style="color:var(--bad)">${ico("trash-2")}Elimina canzone</button>`}
    </form></div>`);
  const back = () => song ? viewSong(song.id) : viewMusic();
  document.getElementById("back").onclick = back;
  const ta = document.getElementById("sl"), sau = document.getElementById("sau"), box = document.getElementById("syncbox");
  // anteprima
  const prev = () => { const vs = parseLyrics(ta.value); document.getElementById("prev").innerHTML = vs.length ? versesHTML(vs) : `<p class="kara-msg">Il testo apparirà qui.</p>`; };
  // strumento tempi
  let stack = [];
  const vLines = () => { const ls = ta.value.split("\n"); return { ls, idx: ls.map((l, i) => (l.trim() && !isNoteLine(l)) ? i : -1).filter(i => i >= 0) }; };
  const getTimes = l => { const m = l.trim().match(LY_TIME); return m ? m[1].split(",").map(parseT).filter(Number.isFinite) : []; };
  const setTimes = (l, ts) => (ts.length ? "@" + ts.map(fmtT).join(",") + " " : "") + l.trim().replace(LY_TIME, "");
  const total = () => vLines().idx.reduce((n, i) => n + getTimes(vLines().ls[i]).length, 0);
  let n = total();
  const tapLabel = () => {
    const { ls, idx } = vLines(); const lbl = document.getElementById("taplbl");
    if (!idx.length) { lbl.textContent = "Scrivi prima il testo"; return; }
    const t = stripLine(ls[idx[n % idx.length]]).replace(/\s*\([^)]*\)/g, "").trim();
    lbl.textContent = `Ora inizia: ${t.length > 28 ? t.slice(0, 27) + "…" : t}`;
  };
  document.getElementById("tap").onclick = () => {
    const { ls, idx } = vLines(); if (!idx.length) return;
    const k = idx[n % idx.length];
    ls[k] = setTimes(ls[k], [...getTimes(ls[k]), sau.currentTime]);
    ta.value = ls.join("\n"); stack.push(k); n++; tapLabel(); prev();
  };
  document.getElementById("undo").onclick = () => {
    const k = stack.pop(); if (k === undefined) { toast("Niente da annullare"); return; }
    const ls = ta.value.split("\n"); const ts = getTimes(ls[k]); ts.pop(); ls[k] = setTimes(ls[k], ts);
    ta.value = ls.join("\n"); n = Math.max(0, n - 1); tapLabel(); prev();
  };
  document.getElementById("clr").onclick = () => {
    ta.value = ta.value.split("\n").map(l => l.trim().replace(LY_TIME, "")).join("\n"); stack = []; n = 0; tapLabel(); prev(); toast("Tempi azzerati");
  };
  ta.oninput = () => { n = total(); tapLabel(); prev(); };
  tapLabel(); prev();
  let objUrl = null;
  document.getElementById("sa").onchange = e => {
    const f = e.target.files[0]; if (objUrl) URL.revokeObjectURL(objUrl);
    if (f) { objUrl = URL.createObjectURL(f); sau.src = objUrl; box.hidden = false; }
  };
  let armed = false;
  const del = document.getElementById("sdel");
  if (del) del.onclick = async () => {
    if (!armed) { armed = true; del.lastChild.textContent = "Tocca ancora per eliminare"; return; }
    try {
      if (song.audio_path) await sb.storage.from("music").remove([song.audio_path]);
      await q(sb.from("songs").delete().eq("id", song.id));
      toast("Canzone eliminata"); viewMusic();
    } catch (e) { toast(errText(e)); }
  };
  document.getElementById("sf").onsubmit = async ev => {
    ev.preventDefault();
    const title = document.getElementById("st").value.trim();
    const file = document.getElementById("sa").files[0];
    const btn = document.getElementById("sbtn"), err = document.getElementById("serr");
    err.innerHTML = "";
    if (!title) { err.innerHTML = `<div class="msg err">Inserisci il titolo.</div>`; return; }
    btn.disabled = true; btn.lastChild.textContent = file ? "Caricamento audio…" : "Salvataggio…";
    let newPath = null;
    try {
      const row = { title, lyrics: ta.value, is_published: document.getElementById("sp").checked, updated_at: new Date().toISOString() };
      if (file) {
        const ext = (file.name.match(/\.([a-z0-9]+)$/i) || [, "m4a"])[1].toLowerCase();
        newPath = `${crypto.randomUUID()}.${ext}`;
        const { error } = await sb.storage.from("music").upload(newPath, file, { contentType: file.type || "audio/mp4", upsert: false });
        if (error) throw error;
        row.audio_path = newPath;
      }
      if (isNew) await q(sb.from("songs").insert(row));
      else await q(sb.from("songs").update(row).eq("id", song.id));
      if (newPath && song?.audio_path) await sb.storage.from("music").remove([song.audio_path]).catch(() => {});
      toast("Canzone salvata");
      if (isNew) viewMusic();
      else viewSong(song.id);
    } catch (e) {
      if (newPath) await sb.storage.from("music").remove([newPath]).catch(() => {});
      btn.disabled = false; btn.lastChild.textContent = "Salva";
      err.innerHTML = `<div class="msg err">${esc(errText(e))}</div>`;
    }
  };
}

async function boot() {
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  if (!S.session) {
    const notice = linkError ? { type: "err", text: /expired|invalid/i.test(linkError) ? "Il link è scaduto o è già stato usato. Chiedi un nuovo invito o usa “Password dimenticata”." : linkError } : null;
    if (linkError) history.replaceState(null, "", APP_URL);
    return viewLogin(notice);
  }
  if (S.mustSetPassword) {
    try { S.me = await q(sb.from("profiles").select("*").eq("id", S.session.user.id).single()); } catch (e) {}
    return viewSetPassword();
  }
  if (BETA_MODE) {
    let role = null;
    try { role = (await q(sb.from("profiles").select("role").eq("id", S.session.user.id).single())).role; } catch (e) {}
    if (role !== "admin") {
      await sb.auth.signOut();
      return render(`<div class="card stack" style="max-width:420px;margin:15vh auto;text-align:center">
        <h2>Versione di test</h2>
        <p class="muted">Questa è una versione beta riservata ai test, non è ancora per gli studenti. Usa il sito principale per accedere al corso.</p>
        <a class="btn primary" href="${esc(PROD_URL)}">Vai al sito principale</a>
      </div>`, true);
    }
  }
  document.getElementById("beta-ribbon").hidden = !BETA_MODE;
  go(S.tab || "path");
}
let booted = false;
sb.auth.onAuthStateChange((event, session) => {
  S.session = session;
  if (event === "PASSWORD_RECOVERY") S.mustSetPassword = true;
  if (!booted) return;
  if (event === "SIGNED_IN" && !S.me) setTimeout(boot, 0);
  if (event === "SIGNED_OUT") { S.me = null; S.stats = null; S.tab = "path"; viewLogin(); }
});
(async () => {
  if (linkType === "invite" || linkType === "recovery") S.mustSetPassword = true;
  await boot();
  booted = true;
})();
</script>
</body>
</html>
